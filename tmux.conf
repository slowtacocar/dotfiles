set -g mouse on
set -g focus-events on

# Allow applications such as vim-oscyank to copy through OSC 52.
set -g allow-passthrough on
set -s set-clipboard on
set -as terminal-features ',xterm*:clipboard:RGB:hyperlinks,ghostty:clipboard:RGB:hyperlinks'

# Forward the active pane's title out to the terminal (Ghostty) tab.
# #T is the title the inner program set via OSC (Ghostty's shell integration
# emits the running command + path), so this is a true passthrough.
set -g set-titles on
set -g set-titles-string "#T"
set -g automatic-rename on
set -g automatic-rename-format '#{?pane_title,#{pane_title},#{pane_current_command}}'

# Flat status bar matching Neovim's Modus Vivendi/lualine palette.
set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style 'bg=#404040,fg=#f0f0f0'
set -g status-left-length 40
set -g status-right-length 60

# Session name; brighten the background while the prefix key is active.
set -g status-left '#[fg=#1e1e1e,bg=#{?client_prefix,#f0f0f0,#82b0ec},bold] #S #[default] '
set -g status-right '#[fg=#f0f0f0,bg=#404040] #h | %H:%M | %d %b '

set -g window-status-separator ' '
set -g window-status-format '#[fg=#808080,bg=#404040,nobold] #I  #[fg=#b0b0b0]#{=24:window_name} '
set -g window-status-current-format '#[fg=#b0b0b0,bg=#1e1e1e,nobold] #I  #[fg=#82b0ec,bold]#{=24:window_name} #[default]'
